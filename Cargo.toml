[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/assistant", "crates/cli", "crates/server", "evals"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
mise-core = { path = "crates/core" }
mise-store = { path = "crates/store" }
mise-assistant = { path = "crates/assistant" }
mise-server = { path = "crates/server" }

jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
automerge = "0.6"
autosurgeon = "0.8"
similar = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
tempfile = "3"
libc = "0.2"
