[package]
name = "mise-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "mise_store"

[dependencies]
mise-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
automerge.workspace = true
autosurgeon.workspace = true
similar.workspace = true
rusqlite.workspace = true
base64.workspace = true
sha2.workspace = true
# Mints each store's replica id, once: log/thread uids are replica-scoped.
getrandom.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# The authorizer hook is how the atomicity tests deny one INSERT mid-unit —
# the same failure surface as SQLITE_BUSY, a full disk, or a kill.
rusqlite = { workspace = true, features = ["hooks"] }
